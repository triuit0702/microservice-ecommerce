spring:
  application:
    name: api-gateway
  zipkin:
      base-url: http://127.0.0.1:9411/
  sleuth:
      sampler:
        probability: 1
  cloud:
    gateway:
      routes:
        # Route cho Identity Service
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/user/**

        # Route cho Product Service - Giỏ hàng (mọi method, yêu cầu đăng nhập)
        # Phải đặt TRƯỚC product-service-read / product-service-write vì gateway match route theo thứ tự
        - id: product-cart
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/product/cart/**
            - Method=GET,POST,PUT,DELETE
          filters:
            - name: AuthenticationFilter

        # Route cho Product Service - Đọc dữ liệu
        - id: product-service-read
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/product/**
            - Method=GET

        # Route cho Product Service - Ghi dữ liệu
        - id: product-service-write
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/product/**
            - Method=POST,PUT,DELETE,OPTIONS
          filters:
            - name: AuthenticationFilter
            - name: RoleBasedAccessFilter
              args:
                requiredRoles: ADMINISTRATOR, EMPLOYEE


        # Route cho Order Service - Đặt hàng
        - id: order-place
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/order
            - Method=POST,OPTIONS
          filters:
            - name: AuthenticationFilter

        # Route cho Order Service - Danh sách đơn hàng của user đang đăng nhập
        - id: order-my-orders
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/order
            - Method=GET
          filters:
            - name: AuthenticationFilter
            - name: RoleBasedAccessFilter
              args:
                requiredRoles: CUSTOMER

        # Route cho Order Service - Lấy đơn hàng theo ID (chỉ đơn của chính user)
        - id: order-get-by-id
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/order/{id}
            - Method=GET
          filters:
            - name: AuthenticationFilter
            - name: RoleBasedAccessFilter
              args:
                requiredRoles: CUSTOMER

        # Route cho Order Service - Lấy tất cả đơn hàng
        - id: order-get-all
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders
            - Method=GET
          filters:
            - name: AuthenticationFilter
            - name: RoleBasedAccessFilter
              args:
                requiredRoles: EMPLOYEE, ADMINISTRATOR

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
             - "http://localhost:3000"
             - "http://localhost:5173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - Content-Type
              - Authorization
              - Accept
              - Origin
              - X-Requested-With
              - X-Csrf-Token
              - If-Match
              - Idempotency-Key
            allow-credentials: true
            max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1
server:
  port: 9191

# Secret must be the same as in identity-service; the default is for dev only
jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  issuer: identity-service
