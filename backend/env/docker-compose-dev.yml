# Infrastructure only (MySQL, Redis, Kafka, Kafka UI, Prometheus, Grafana). Single source of truth:
# backend/docker-compose.yml includes this file for the full stack.
# Dev:  cd backend && docker compose -f env/docker-compose-dev.yml up -d

# Same project name as docker-compose.yml, so both ways share (and reuse) the same infra containers
name: ecommerce

networks:
  shop-network:
    driver: bridge

volumes:
  grafana-data:

services:
  # mysql
  mysql:
    image: mysql:8.0
    container_name: container-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - ./data/db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d/
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--skip-character-set-client-handshake'  # force utf8mb4 on all connections
    ]
    healthcheck:
      # TCP check: only passes once init.sql has finished and the real server is up
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - shop-network

  #Redis
  redis:
    container_name: container-redis
    image: redis:latest
    ports:
      - "6319:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
        - shop-network

  # kafka visualization tool
  kafka-ui:
    container_name: container-kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080" # map kafka UI to port 8080 on the host
    depends_on:
      kafka1:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: env-dev     # cluster name
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092   # cluster bootstrap servers
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - shop-network

  # Kafka cluster
  kafka1:
    image: bitnamilegacy/kafka:3.5
    container_name: container-kafka
    ports:
      - 9192:9092   # broker port
      - 9193:9094   #
    environment:
      ### General configuration
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Define Kafka server-side socket listening port
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # Define security protocols
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # set advertised listener
      - KAFKA_CFG_ADVERTISED_LISTENERS=EXTERNAL://localhost:9193,PLAINTEXT://kafka1:9092
      # Interbroker listener name
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Cluster ID for kafka, must be the same across the cluster. Use a generated UUID
      - KAFKA_KRAFT_CLUSTER_ID=LelM2dIFQkiUFvXCEcqRWA
      - CLUSTER_ID=LelM2dIFQkiUFvXCEcqRWA
      # Cluster address
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093
      # Allow PLAINTEXT listerer (default is false; not recommended for production)
      - ALLOW_PLAINTEXT_LISTENER=yes
      # Set maximum and initial memory for the broker
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
      # Enable auto-creation of topics
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      # Message retention period (in milliseconds), set to 7 days
      - KAFKA_LOG_RETENTION_MS=604800000
      ### Broker configurations
      # Define external access address (host IP and port) -> get IP: run docker inspect kafka1
      # - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA1_IP}:9092
      # Broker ID, must be unique
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_NODE_ID=1
    volumes:
      - ./data/bitnami/kafka1:/bitnamilegacy/kafka
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092" ]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - shop-network
  # Prometheus: scrapes /actuator/prometheus of services running on the host
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: container-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; Docker Desktop has it by default
    networks:
      - shop-network

  # MySQL metrics for Prometheus: one exporter covers the whole server (user_db, product_db, order_db)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: container-mysqld-exporter
    command:
      - '--mysqld.address=mysql:3306'
      - '--mysqld.username=root'
      - '--collect.info_schema.tables'
      - '--collect.info_schema.tables.databases=user_db,product_db,order_db'
      - '--collect.perf_schema.eventsstatements'
      - '--collect.perf_schema.indexiowaits'
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:-123456}   # must match MYSQL_ROOT_PASSWORD above
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shop-network

  # Grafana: datasource and dashboards are provisioned from env/grafana
  grafana:
    image: grafana/grafana:13.3.2
    container_name: container-grafana
    ports:
      - "3001:3000"   # 3000 is used by the admin frontend
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # only applied when grafana-data is first created
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - shop-network
