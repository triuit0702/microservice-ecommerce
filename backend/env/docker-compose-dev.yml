version: '3.2'

networks:
  shop-network:
    driver: bridge

services:
  # mysql
  mysql:
    image: mysql:8.0
    container_name: container-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - ./data/db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d/
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--skip-character-set-client-handshake'  # Buộc tất cả kết nối sử dụng utf8mb4
    ]
    networks:
      - shop-network

  #Redis
  redis:
    container_name: container-redis
    image: redis:latest
    ports:
      - "6319:6379"
    networks:
        - shop-network

  # kafka visualization tool
  kafka-ui:
    container_name: container-kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080" # map kafka UI to port 8080 on the host
    depends_on:
      kafka1:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: env-dev     # cluster name
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092   # cluster bootstrap servers
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - shop-network

  # Kafka cluster
  kafka1:
    image: bitnamilegacy/kafka:3.5
    container_name: container-kafka
    ports:
      - 9192:9092   # broker port
      - 9193:9094   #
    environment:
      ### General configuration
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Define Kafka server-side socket listening port
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # Define security protocols
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # set advertised listener
      - KAFKA_CFG_ADVERTISED_LISTENERS=EXTERNAL://192.168.1.12:9193,PLAINTEXT://kafka1:9092
      # Interbroker listener name
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Cluster ID for kafka, must be the same across the cluster. Use a generated UUID
      - KAFKA_KRAFT_CLUSTER_ID=LelM2dIFQkiUFvXCEcqRWA
      - CLUSTER_ID=LelM2dIFQkiUFvXCEcqRWA
      # Cluster address
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093
      # Allow PLAINTEXT listerer (default is false; not recommended for production)
      - ALLOW_PLAINTEXT_LISTENER=yes
      # Set maximum and initial memory for the broker
      - KAFKA_HEAP_OPTS=-Xmx512M -Xms256M
      # Enable auto-creation of topics
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      # Message retention period (in milliseconds), set to 7 days
      - KAFKA_LOG_RETENTION_MS=604800000
      ### Broker configurations
      # Define external access address (host IP and port) -> get IP: run docker inspect kafka1
      # - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA1_IP}:9092
      # Broker ID, must be unique
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_NODE_ID=1
    volumes:
      - ./data/bitnami/kafka1:/bitnamilegacy/kafka
    healthcheck:
      test: [ "CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092" ]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - shop-network