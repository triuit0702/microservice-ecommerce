# Prometheus scrape config for local dev.
# Services run on the host (IDE / mvnw), so targets point to host.docker.internal.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9191"]
        labels: { service: api-gateway }
      - targets: ["host.docker.internal:9898"]
        labels: { service: identity-service }
      - targets: ["host.docker.internal:8084"]
        labels: { service: product-service }
      - targets: ["host.docker.internal:9195"]
        labels: { service: order-service }

  # Single MySQL server shared by all services
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
