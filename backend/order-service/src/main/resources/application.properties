spring.application.name=order-service
server.port=9195
management.endpoints.web.exposure.include=*

##Configure Kafka Broker.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9193}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=order-group-test

## Topic names (see KafkaTopicsProperties); topics owned by this service are created with this partition count
app.kafka.topics.inventory-command=${KAFKA_TOPIC_INVENTORY_COMMAND:inventory.command}
app.kafka.topics.inventory-result=${KAFKA_TOPIC_INVENTORY_RESULT:inventory.result}
app.kafka.topics.partitions=3
# Dev creates its topics on startup; set to false where topics are managed as infrastructure
spring.kafka.admin.auto-create=${KAFKA_ADMIN_AUTO_CREATE:true}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps JsonDeserializer: a malformed record goes to the DLT instead of blocking the partition
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=net.javaguides.common_lib.dto.order.OrderMessageEvent

## Orders still PENDING after this time are cancelled and their stock is released
order.pending-timeout-minutes=${ORDER_PENDING_TIMEOUT_MINUTES:5}
order.pending-timeout-check-interval-ms=60000



spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6319}
spring.redis.timeout=${SPRING_REDIS_TIMEOUT:60000}

## Configure MYSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/order_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update