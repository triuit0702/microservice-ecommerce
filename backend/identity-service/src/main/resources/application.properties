spring.application.name=identity-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6319}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:60000}


server.port=9898
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=*
#google oauth2 (authorization code flow, code is sent from frontend)
# Secrets come from env vars or the gitignored application-local.properties (see application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties
google.oauth2.client-id=${GOOGLE_CLIENT_ID:774205728232-vj2sdgrlkdmc6a1dc8876m27don4v7tj.apps.googleusercontent.com}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:}
# "postmessage" when frontend uses popup flow (@react-oauth/google), otherwise the registered redirect URI
google.oauth2.redirect-uri=${GOOGLE_REDIRECT_URI:postmessage}
