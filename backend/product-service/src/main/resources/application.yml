spring:
  application:
    name: product-service
  profiles:
    active: dev
  kafka:
    # Dev creates its topics on startup; set to false where topics are managed as infrastructure
    admin:
      auto-create: ${KAFKA_ADMIN_AUTO_CREATE:true}
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9193}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: product
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A record that cannot be deserialized goes to the DLT instead of failing poll() forever
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: net.javaguides.common_lib.dto.order.OrderMessageEvent

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6319}
      timeout: ${SPRING_REDIS_TIMEOUT:60000}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 15MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/product_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

server:
  port: 8084

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "*"

cloudinary:
  # Secrets come from env vars, never hard-code them here
  cloud-name: ${CLOUDINARY_CLOUD_NAME:shopdevtri}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Topic names (see KafkaTopicsProperties); topics owned by this service are created with this partition count
app:
  kafka:
    topics:
      inventory-command: ${KAFKA_TOPIC_INVENTORY_COMMAND:inventory.command}
      inventory-result: ${KAFKA_TOPIC_INVENTORY_RESULT:inventory.result}
      partitions: 3
